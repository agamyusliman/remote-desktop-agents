[package]
name = "remot-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted remote desktop + omp terminal for mobile"

[dependencies]
http = "1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
enigo = "0.6"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
portable-pty = "0.9"
qrcode = "0.14"
rand = "0.9"
scap = "0.0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.36.1"
mime_guess = "2.0.5"
tao = "0.37.3"
wry = "0.57.3"
tray-icon = "0.24.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
